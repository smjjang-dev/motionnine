<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<title>로그인 — 모션나인 발주관리</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="topbar">
  <a class="logo" href="orders.html"><img src="../img/logo.svg" alt=""> 모션나인 발주관리</a>
  <nav class="topnav">
    <a href="orders.html">발주목록</a><a href="order-form.html">발주등록</a><a href="admin.html">관리자설정</a><a href="trash.html">삭제내역</a>
  </nav>
  <div class="spacer"></div>
</div>
<div class="wrap" id="wrap">
<section class="screen">
  <div class="mock">
    <div class="auth-box">
      <div class="logo-big"><img src="../img/logo.svg" alt="모션나인">모션나인</div>
      <h3>발주현황 관리 로그인</h3>
      <p class="hint" style="text-align:center">관리자 전용 · 내부용 (noindex)</p>
      <button class="btn google" style="width:100%;margin-top:10px" type="button" id="btnGoogle">G Google로 계속하기</button>
      <div class="hint" style="text-align:center;margin:10px 0">또는</div>
      <label for="li-email">이메일 *</label>
      <input id="li-email" type="email" autocomplete="email" placeholder="admin@example.com">
      <label for="li-pw">비밀번호 *</label>
      <div class="row">
        <input id="li-pw" type="password" autocomplete="current-password" placeholder="비밀번호" style="flex:1">
        <button class="btn ghost sm" type="button" id="pwToggle" aria-label="비밀번호 보기 전환">보기</button>
      </div>
      <div class="err" id="loginErr" style="display:none"></div>
      <button class="btn primary" style="width:100%;margin-top:12px" type="button" id="btnLogin">이메일로 로그인</button>
      <div class="row" style="margin-top:10px">
        <a class="btn ghost sm" style="flex:1" href="signup.html#t-join">회원가입</a>
        <a class="btn ghost sm" style="flex:1" href="signup.html#t-reset">비밀번호 재설정</a>
      </div>
    </div>
  </div>
</section>
</div>
<script src="../js/common.js"></script>
<!-- vendor 자체호스팅 (web/vendor/, THIRD_PARTY_NOTICES.md 참조) -->
<script src="../vendor/supabase-js.min.js"></script>
<script type="module" src="../js/login.js"></script>
</body>
</html>

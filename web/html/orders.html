<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<title>발주목록 — 모션나인 발주관리</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/print.css">
</head>
<body>
<div class="topbar">
  <a class="logo" href="orders.html"><img src="../img/logo.svg" alt=""> 모션나인 발주관리</a>
  <nav class="topnav">
    <a href="orders.html" class="active">발주목록</a><a href="order-form.html">발주등록</a><a href="admin.html">관리자설정</a><a href="trash.html">삭제내역</a>
  </nav>
  <div class="spacer"></div>
</div>
<div class="wrap" id="wrap">
<section class="screen">
  <div class="mock">
    <p class="hint" id="noticeBar" style="display:none"></p>
    <div class="bar"><span class="b-logo">[모션나인 발주관리]</span><span class="hint" style="color:#cbd5e1">발주목록</span><span class="b-user"><span id="userLabel">-</span> · <button class="btn sm" type="button" id="btnLogout" style="min-height:0;padding:2px 8px">로그아웃</button></span></div>
    <div class="stage-cards">
      <div class="stage s1" data-stage="1"><b id="cnt1">-</b><span>접수(1)</span></div>
      <div class="stage s2" data-stage="2"><b id="cnt2">-</b><span>준비(2)</span></div>
      <div class="stage s3" data-stage="3"><b id="cnt3">-</b><span>발송(3)</span></div>
      <div class="stage s9" data-stage="9"><b id="cnt9">-</b><span>완료(9)</span></div>
    </div>
    <div class="filter">
      <input class="grow" id="q" placeholder="검색: 거래처·주문자·제품·제품코드·발주번호">
      <button class="btn primary sm" type="button" id="btnSearch">검색</button>
      <input type="date" id="fromDate" style="max-width:160px"> ~ <input type="date" id="toDate" style="max-width:160px">
      <select id="stageSel" style="max-width:150px"><option value="">발송단계: 전체</option><option value="1">접수</option><option value="2">준비</option><option value="3">발송</option><option value="9">완료</option></select>
      <button class="btn ghost sm" type="button" id="btnReset">초기화</button>
      <button class="btn sm" type="button" id="btnPdf">PDF(목록 내보내기)</button>
      <a class="btn primary sm" href="order-form.html">+ 발주 등록</a>
    </div>
    <p class="hint">집계 기준: 검색어·기간 적용, 단계 필터 제외 · 날짜 필터 KST 00:00~익일00:00 · 정렬: 발주일↓+ID↓ · 20건/페이지(50건 선택)</p>
    <div id="stateBox"></div>
    <table class="grid desktop-only" id="orderTable">
      <thead><tr><th>발주번호</th><th>발주일(KST)</th><th>거래처</th><th>주문자</th><th>제품/코드</th><th class="num">수량</th><th class="num">합계(청구액)</th><th>단계</th></tr></thead>
      <tbody id="orderRows"></tbody>
    </table>
    <div class="cards-m" id="orderCards"></div>
    <div class="pager" id="pager"></div>
    <div class="modal" id="pdfModal" style="display:none"><b>목록 PDF 내보내기</b><br>
      <span id="pdfInfo">-</span><br>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" type="button" id="btnPdfPage">현재 페이지</button><button class="btn dark sm" type="button" id="btnPdfAll">조건 전체(최대 200건)</button><button class="btn ghost sm" type="button" id="btnPdfCancel">취소</button></div>
      <p class="hint" id="pdfMsg"></p></div>
    <div class="anno"><b>알림:</b> 검색 결과가 없으면 필터를 초기화해 보세요. 목록을 불러오지 못하면 재시도해 주세요.</div>
  </div>
</section>
</div>
<script src="../js/common.js"></script>
<!-- vendor 자체호스팅 (web/vendor/, THIRD_PARTY_NOTICES.md 참조) -->
<script src="../vendor/supabase-js.min.js"></script>
<script src="../vendor/html2canvas.min.js"></script>
<script src="../vendor/jspdf.umd.min.js"></script>
<script type="module" src="../js/order-list.js"></script>
<script type="module" src="../js/export.js"></script>
</body>
</html>

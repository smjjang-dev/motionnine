<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<title>관리자 설정 — 모션나인 발주관리</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="topbar">
  <a class="logo" href="orders.html"><img src="../img/logo.svg" alt=""> 모션나인 발주관리</a>
  <nav class="topnav">
    <a href="orders.html">발주목록</a><a href="order-form.html">발주등록</a><a href="admin.html" class="active">관리자설정</a><a href="trash.html">삭제내역</a>
  </nav>
  <div class="spacer"></div>
</div>
<div class="wrap" id="wrap">
<section class="screen">
  <div class="mock">
    <div class="bar"><span class="b-logo">관리자 설정</span><span class="b-user">owner 전용 · 일반 admin 접근 불가</span></div>
    <p class="hint" id="adminMsg"></p>
    <div class="summary" style="margin-top:12px"><h4 id="quotaText">정원: 활성 - / 최대 -</h4>
    <div class="quota"><i id="quotaBar" style="width:0%"></i></div>
    <p class="hint">마지막 대표 관리자는 중지·강등할 수 없으며, 정원을 현재 활성 인원보다 낮게 줄일 수 없습니다.</p>
    <p class="hint" id="limitWarn"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><select id="limitSel" style="max-width:200px"><option value="5">최대 인원: 5</option><option value="4">4</option><option value="3">3</option></select><button class="btn primary sm" type="button" id="btnLimit">정원 변경</button></div></div>
    <h4 id="pendTitle">승인 대기</h4>
    <table class="grid"><thead><tr><th>표시 이름·이메일</th><th>인증</th><th>신청일</th><th>처리</th></tr></thead>
    <tbody id="pendRows"></tbody></table>
    <p class="hint">이메일 미확인 계정은 승인 버튼 비활성화.</p>
    <h4 id="activeTitle">활성</h4>
    <table class="grid"><thead><tr><th>이름</th><th>역할</th><th>상태</th><th>처리</th></tr></thead>
    <tbody id="activeRows"></tbody></table>
    <h4 id="stopTitle">중지 · 승인/중지 이력</h4>
    <table class="grid"><thead><tr><th>대상</th><th>상태</th><th>승인·갱신 시각</th><th>처리</th></tr></thead>
    <tbody id="stopRows"></tbody></table>
    <div class="modal" id="cfModal" style="display:none"><b>관리자 처리 확인</b><br>
      <span id="cfText">-</span><br>
      <div style="margin-top:8px;display:flex;gap:8px"><button class="btn primary sm" type="button" id="cfOk">확인</button><button class="btn ghost sm" type="button" id="cfCancel">취소</button></div></div>
  </div>
</section>
</div>
<script src="../js/common.js"></script>
<!-- vendor 자체호스팅 (web/vendor/, THIRD_PARTY_NOTICES.md 참조) -->
<script src="../vendor/supabase-js.min.js"></script>
<script type="module" src="../js/admin.js"></script>
</body>
</html>
